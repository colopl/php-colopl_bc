name: Coverage
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      archive_name:
        required: true
        type: string
jobs:
  init:
    runs-on: ubuntu-24.04
    env:
      PSKEL_BUILD_TARGET: base
    outputs:
      needs-init: ${{ steps.check.outputs.needs-init }}
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/source-archive
      - name: Extract prepared workspace
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/source-archive/${ARCHIVE_NAME}"
          tar -xzf "${ARCHIVE_PATH}" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          rm -f "${ARCHIVE_PATH}"
      - name: Check if initialization is needed
        id: check
        run: |
          if test -f "ext/.gitkeep" && test "$(cat "ext/.gitkeep")" = "pskel_uninitialized"; then
            echo "needs-init=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs-init=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Initialize extension
        if: steps.check.outputs.needs-init == 'true'
        run: |
          docker compose run -v "$(pwd)/ext:/ext" --rm shell pskel init skeleton
      - name: Upload initialized extension
        if: steps.check.outputs.needs-init == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: initialized-ext-coverage
          path: ext/
          retention-days: 1
  coverage:
    needs: init
    runs-on: ${{ matrix.platform }}
    env:
      PSKEL_BUILD_TARGET: base
    strategy:
      matrix:
        versions: ['8.5']
        platform: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        ts: ['cli', 'zts']
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/source-archive
      - name: Extract prepared workspace
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/source-archive/${ARCHIVE_NAME}"
          tar -xzf "${ARCHIVE_PATH}" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          rm -f "${ARCHIVE_PATH}"
      - name: Download initialized extension
        if: needs.init.outputs.needs-init == 'true'
        uses: actions/download-artifact@v8
        with:
          name: initialized-ext-coverage
          path: ext/
      - name: Build container and run coverage
        run: |
          rm -f "ext/.gitkeep"
          docker compose build \
            --build-arg TAG="${{ matrix.versions }}-${{ matrix.ts }}-trixie" \
            --build-arg SKIP_VALGRIND=1 \
            shell
          docker compose run -v "$(pwd)/ext:/ext" --rm shell pskel coverage
          cp "ext/lcov.info" "${{ matrix.platform }}_${{ matrix.versions }}_${{ matrix.ts }}_lcov.info"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.versions }}-${{ matrix.ts }}
          path: "${{ matrix.platform }}_${{ matrix.versions }}_${{ matrix.ts }}_lcov.info"
          retention-days: 1
  deploy-pages:
    needs:
      - init
      - coverage
    runs-on: ubuntu-24.04
    env:
      PSKEL_BUILD_TARGET: base
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download prepared workspace
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/source-archive
      - name: Extract prepared workspace
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/source-archive/${ARCHIVE_NAME}"
          tar -xzf "${ARCHIVE_PATH}" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          rm -f "${ARCHIVE_PATH}"
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-files/
      - name: Download initialized extension
        if: needs.init.outputs.needs-init == 'true'
        uses: actions/download-artifact@v8
        with:
          name: initialized-ext-coverage
          path: ext/
      - name: Build container
        run: |
          docker compose build \
            --build-arg TAG="8.5-cli-trixie" \
            --build-arg SKIP_VALGRIND=1 \
            shell
      - name: Generate integrated HTML coverage report
        run: |
          mkdir -p "coverage-html"
          docker compose run --rm \
            -v "$(pwd)/ext:/ext" \
            -v "$(pwd)/coverage-files:/coverage-files" \
            -v "$(pwd)/coverage-html:/coverage-html" \
            shell pskel coverage-report /coverage-files /coverage-html
          rm -f "coverage-html/total.info"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-html/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
