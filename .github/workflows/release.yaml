name: Build and release extension artifacts

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  CreateDraftRelease:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.metadata.outputs.version }}
      extension_name: ${{ steps.metadata.outputs.extension-name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}
      - name: Extract release metadata
        id: metadata
        run: |
          EXT_NAME="$(jq -r '."php-ext"."extension-name" // empty' "composer.json")"
          if test -z "${EXT_NAME}"; then
            echo "Error: php-ext.extension-name not found in composer.json." >&2
            exit 1
          fi
          echo "extension-name=${EXT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Create draft release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release already exists: ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft --notes-from-tag
          fi
      - name: Create and upload PIE pre-packaged source
        env:
          GH_TOKEN: ${{ github.token }}
          EXT_NAME: ${{ steps.metadata.outputs.extension-name }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          SRC_ARCHIVE_PATH="${RUNNER_TEMP}/php_${EXT_NAME}-${GITHUB_REF_NAME}-src.tgz"
          git archive --format="tar.gz" --prefix="${EXT_NAME}-${RELEASE_VERSION}/" --output "${SRC_ARCHIVE_PATH}" HEAD
          gh release upload "${GITHUB_REF_NAME}" "${SRC_ARCHIVE_PATH}" --clobber
  BuildDebPackages:
    needs: [ CreateDraftRelease ]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2204/Dockerfile
            image_name: colopl-bc-u2204-php81
            artifact_name: ubuntu2204-php81-amd64-debs
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2204/Dockerfile
            image_name: colopl-bc-u2204-php81
            artifact_name: ubuntu2204-php81-arm64-debs
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2204_sury84/Dockerfile
            image_name: colopl-bc-u2204-sury84-php84
            artifact_name: ubuntu2204-sury84-php84-amd64-debs
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2204_sury84/Dockerfile
            image_name: colopl-bc-u2204-sury84-php84
            artifact_name: ubuntu2204-sury84-php84-arm64-debs
          - runs-on: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            dockerfile: build/ubuntu2604/Dockerfile
            image_name: colopl-bc-u2604-php85
            artifact_name: ubuntu2604-php85-amd64-debs
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            dockerfile: build/ubuntu2604/Dockerfile
            image_name: colopl-bc-u2604-php85
            artifact_name: ubuntu2604-php85-arm64-debs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build package image
        run: |
          docker build \
            --pull \
            --build-arg PLATFORM="${{ matrix.platform }}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image_name }}:${{ matrix.arch }}" \
            .
      - name: Build deb packages
        run: |
          mkdir -p "artifacts"
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e VERSION="${{ needs.CreateDraftRelease.outputs.package_version }}" \
            -v "${PWD}/artifacts:/tmp/artifacts" \
            "${{ matrix.image_name }}:${{ matrix.arch }}"
      - name: Upload deb package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1
  BuildPieLinux:
    needs: [ CreateDraftRelease ]
    runs-on: ${{ matrix.runs-on }}
    env:
      PSKEL_BUILD_TARGET: builder
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['cli', 'zts']
        distro: ['trixie', 'alpine']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build PIE pre-packaged binary
        env:
          EXT_NAME: ${{ needs.CreateDraftRelease.outputs.extension_name }}
        run: |
          docker compose build \
            --build-arg TAG="${{ matrix.version }}-${{ matrix.ts }}-${{ matrix.distro }}" \
            shell
          mkdir -p "dist"
          docker compose run \
            --no-deps \
            -v "$(pwd)/dist:/dist" \
            -e EXT_CONFIGURE_OPTS="--enable-${EXT_NAME}" \
            --rm shell pskel package "${GITHUB_REF_NAME}" /dist "${EXT_NAME}"
      - name: Upload PIE pre-packaged binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
  BuildPieMacos:
    needs: [ CreateDraftRelease ]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runs-on: ['macos-15', 'macos-15-intel']
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.version }}
          extensions: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Build and upload PIE pre-packaged binary
        env:
          GH_TOKEN: ${{ github.token }}
          EXT_NAME: ${{ needs.CreateDraftRelease.outputs.extension_name }}
        run: |
          mkdir -p "dist"
          EXT_CONFIGURE_OPTS="--enable-${EXT_NAME}" ./pskel.sh package "${GITHUB_REF_NAME}" "dist" "${EXT_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
  BuildWindows:
    needs: [ CreateDraftRelease ]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        arch: ['x64', 'x86']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stage extension source for Windows builder
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .\ext -Force | Copy-Item -Destination . -Recurse -Force
      - name: Build the extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-${{ needs.CreateDraftRelease.outputs.extension_name }}
  ReleaseWindows:
    runs-on: ubuntu-latest
    needs: BuildWindows
    permissions:
      contents: write
    steps:
      - name: Upload artifact to the release
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
  ReleaseDebPackages:
    runs-on: ubuntu-latest
    needs: BuildDebPackages
    permissions:
      contents: write
    steps:
      - name: Download deb package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-debs'
          path: deb-artifacts
          merge-multiple: true
      - name: Upload deb packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" deb-artifacts/* --clobber --repo "${{ github.repository }}"
  PublishRelease:
    needs: [ BuildPieLinux, BuildPieMacos, ReleaseWindows, ReleaseDebPackages ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
